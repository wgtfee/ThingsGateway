name: ThingsGateway Develop IAM Contract

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate ThingsGateway IAM web and machine identity contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('src/ThingsGateway.Server')
          centralized = json.loads((root / 'appsettings.Centralized.json').read_text(encoding='utf-8-sig'))
          web = (root / 'IndustrialSecurity/ThingGetWayIamWebAuthController.cs').read_text(encoding='utf-8-sig')
          machine = (root / 'IndustrialSecurity/ThingGetWayMachineIdentity.cs').read_text(encoding='utf-8-sig')
          startup = (root / 'Program/Startup.cs').read_text(encoding='utf-8-sig')

          security = centralized['Security']
          assert security['Authentication']['Mode'] == 'Centralized'
          assert security['Authorization']['Mode'] == 'Centralized'
          assert security['Central']['SystemCode'] == 'THINGSGATEWAY'
          assert security['Central']['RequireSystemAccess'] is True
          assert security['Central']['PermissionFailureMode'] == 'FailClosed'

          iam_web = centralized['IndustrialIamWeb']
          assert iam_web['Enabled'] is True
          assert iam_web['ClientId'] == 'industrial-thingsgateway-web'
          assert iam_web['RedirectUri'].endswith('/thinggateway/auth/iam/callback')

          for marker in [
              '[Route("auth/iam")]',
              '[HttpGet("signin")]',
              '[HttpGet("login")]',
              '[HttpGet("callback")]',
              'code_challenge_method',
              'HasSystemAccessAsync',
              'LoginTrustedLocalUserAsync',
          ]:
              assert marker in web, f'Missing ThingsGateway web SSO contract: {marker}'

          machine_config = centralized['IndustrialMachineIdentity']
          assert machine_config['Enabled'] is True
          assert machine_config['ClientId'] == 'thingsgateway-service'
          assert machine_config['Scope'] == 'iot.gateway.connect'
          assert 'client_credentials' in machine

          assert 'AddIndustrialSecurity' in startup
          assert 'UseIndustrialSecurity' in startup
          authn = startup.index('app.UseAuthentication()')
          industrial = startup.index('app.UseIndustrialSecurity()')
          authz = startup.index('app.UseAuthorization()')
          assert authn < industrial < authz, 'ThingsGateway security middleware order must be Authentication -> Industrial.Security -> Authorization'
          print('ThingsGateway develop IAM contract OK')

      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'ci/thingsgateway-iam-contract',
              description: passed ? 'ThingsGateway IAM contract passed' : 'ThingsGateway IAM contract failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
