name: develop-iam-validation

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ThingsGateway
        uses: actions/checkout@v4
        with:
          path: platform/ThingsGateway
          persist-credentials: false

      - name: Validate IAM SSO contracts
        working-directory: platform/ThingsGateway
        run: python3 scripts/validate_iam_sso.py

      - name: Validate live acceptance script syntax
        working-directory: platform/ThingsGateway
        run: python3 -m py_compile scripts/validate_iam_sso_live.py

      - name: Require GitHub App configuration
        shell: bash
        env:
          PLATFORM_GITHUB_APP_CLIENT_ID: ${{ vars.PLATFORM_GITHUB_APP_CLIENT_ID }}
          PLATFORM_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_GITHUB_APP_PRIVATE_KEY }}
        run: |
          failed=0
          if [ -z "${PLATFORM_GITHUB_APP_CLIENT_ID}" ]; then
            echo "::error::Repository variable PLATFORM_GITHUB_APP_CLIENT_ID is not configured."
            failed=1
          fi
          if [ -z "${PLATFORM_GITHUB_APP_PRIVATE_KEY}" ]; then
            echo "::error::Repository secret PLATFORM_GITHUB_APP_PRIVATE_KEY is not configured."
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "GitHub App configuration is present."

      - name: Generate platform GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_GITHUB_APP_PRIVATE_KEY }}
          owner: wgtfee
          repositories: |
            Industrial.Security.Abstractions
            Industrial.Security.AspNetCore
            Industrial.Health.Abstractions
          permission-contents: read

      - name: Verify GitHub App repository access
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          failed=0
          for repo in Industrial.Security.Abstractions Industrial.Security.AspNetCore Industrial.Health.Abstractions; do
            code=$(curl -sS -o /tmp/github-repo.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/wgtfee/${repo}")
            echo "${repo}: HTTP ${code}"
            if [ "${code}" != "200" ]; then
              failed=1
              message=$(python3 -c 'import json; print(json.load(open("/tmp/github-repo.json", encoding="utf-8")).get("message", "unknown"))' 2>/dev/null || true)
              echo "GitHub API message: ${message:-unreadable response}"
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::GitHub App installation token cannot read one or more required private repositories."
            exit 1
          fi

      - name: Checkout Security.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.Abstractions
          ref: master
          path: platform/ThingsGateway/Industrial.Security/src/Industrial.Security.Abstractions
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout Security.AspNetCore
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.AspNetCore
          ref: master
          path: platform/ThingsGateway/Industrial.Security/src/Industrial.Security.AspNetCore
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout Health.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Health.Abstractions
          ref: master
          path: platform/ThingsGateway/Industrial.Health/src/Industrial.Health.Abstractions
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore ThingsGateway server
        working-directory: platform/ThingsGateway
        run: dotnet restore src/ThingsGateway.Server/ThingsGateway.Server.csproj -p:EnableProPackages=false -p:EnableWindowsTargeting=true

      - name: Build ThingsGateway server
        working-directory: platform/ThingsGateway
        run: dotnet build src/ThingsGateway.Server/ThingsGateway.Server.csproj -f net8.0 --configuration Release --no-restore -p:EnableProPackages=false -p:EnableWindowsTargeting=true

      - name: Publish cloud validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'cloud-validation',
              description: passed ? 'ThingsGateway cloud validation passed' : 'ThingsGateway cloud validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
