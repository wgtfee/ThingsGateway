name: develop-iam-validation

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ThingsGateway
        uses: actions/checkout@v4
        with:
          path: platform/ThingsGateway

      - name: Validate IAM SSO contracts
        working-directory: platform/ThingsGateway
        run: python3 scripts/validate_iam_sso.py

      - name: Validate live acceptance script syntax
        working-directory: platform/ThingsGateway
        run: python3 -m py_compile scripts/validate_iam_sso_live.py

      - name: Diagnose PLATFORM_CI_TOKEN format
        shell: bash
        env:
          PLATFORM_CI_TOKEN: ${{ secrets.PLATFORM_CI_TOKEN }}
        run: |
          token="${PLATFORM_CI_TOKEN}"
          echo "PLATFORM_CI_TOKEN length: ${#token}"
          case "${token}" in
            github_pat_*) echo "PLATFORM_CI_TOKEN format: fine-grained PAT prefix detected" ;;
            ghp_*) echo "PLATFORM_CI_TOKEN format: classic PAT prefix detected" ;;
            gho_*) echo "PLATFORM_CI_TOKEN format: OAuth token prefix detected" ;;
            ghs_*) echo "PLATFORM_CI_TOKEN format: GitHub App installation token prefix detected" ;;
            ghu_*) echo "PLATFORM_CI_TOKEN format: GitHub App user token prefix detected" ;;
            *) echo "PLATFORM_CI_TOKEN format: unrecognized prefix" ;;
          esac
          if [[ "${token}" =~ ^[[:space:]] || "${token}" =~ [[:space:]]$ ]]; then
            echo "PLATFORM_CI_TOKEN whitespace: leading/trailing whitespace detected"
          else
            echo "PLATFORM_CI_TOKEN whitespace: none detected"
          fi
          if [[ "${token}" == \"*\" || "${token}" == \'*\' ]]; then
            echo "PLATFORM_CI_TOKEN quotes: surrounding quotes detected"
          else
            echo "PLATFORM_CI_TOKEN quotes: none detected"
          fi

      - name: Diagnose configured secret candidates
        shell: bash
        env:
          PLATFORM_CI_TOKEN: ${{ secrets.PLATFORM_CI_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          PAT: ${{ secrets.PAT }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          probe_token() {
            name="$1"
            token="$2"
            if [ -z "${token}" ]; then
              echo "${name}: NOT_CONFIGURED"
              return
            fi

            user_code=$(curl -sS -o /tmp/github-user.json -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user")
            echo "${name}: /user HTTP ${user_code}"

            for repo in Industrial.Security.Abstractions Industrial.Security.AspNetCore Industrial.Health.Abstractions; do
              repo_code=$(curl -sS -o /tmp/github-repo.json -w "%{http_code}" \
                -H "Authorization: Bearer ${token}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/wgtfee/${repo}")
              echo "${name}: ${repo} HTTP ${repo_code}"
            done
          }

          probe_token "PLATFORM_CI_TOKEN" "${PLATFORM_CI_TOKEN}"
          probe_token "GH_PAT" "${GH_PAT}"
          probe_token "GITHUB_PAT" "${GITHUB_PAT}"
          probe_token "PAT" "${PAT}"
          probe_token "REPO_TOKEN" "${REPO_TOKEN}"
          probe_token "ACCESS_TOKEN" "${ACCESS_TOKEN}"
          probe_token "PERSONAL_ACCESS_TOKEN" "${PERSONAL_ACCESS_TOKEN}"

      - name: Require PLATFORM_CI_TOKEN
        shell: bash
        env:
          PLATFORM_CI_TOKEN: ${{ secrets.PLATFORM_CI_TOKEN }}
        run: |
          if [ -z "${PLATFORM_CI_TOKEN}" ]; then
            echo "::error::PLATFORM_CI_TOKEN is not configured. This workflow requires one dedicated cross-repository credential."
            exit 1
          fi
          echo "PLATFORM_CI_TOKEN is configured."

      - name: Probe cross-repository token access
        shell: bash
        env:
          PLATFORM_CI_TOKEN: ${{ secrets.PLATFORM_CI_TOKEN }}
        run: |
          failed=0
          for repo in Industrial.Security.Abstractions Industrial.Security.AspNetCore Industrial.Health.Abstractions; do
            code=$(curl -sS -o /tmp/github-repo.json -w "%{http_code}" \
              -H "Authorization: Bearer ${PLATFORM_CI_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/wgtfee/${repo}")
            echo "${repo}: HTTP ${code}"
            if [ "${code}" != "200" ]; then
              failed=1
              message=$(python3 -c 'import json; print(json.load(open("/tmp/github-repo.json", encoding="utf-8")).get("message", "unknown"))' 2>/dev/null || true)
              echo "GitHub API message: ${message:-unreadable response}"
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::PLATFORM_CI_TOKEN cannot read one or more required private repositories."
            exit 1
          fi

      - name: Checkout Security.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.Abstractions
          ref: master
          path: platform/Industrial.Security/src/Industrial.Security.Abstractions
          token: ${{ secrets.PLATFORM_CI_TOKEN }}

      - name: Checkout Security.AspNetCore
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Security.AspNetCore
          ref: master
          path: platform/Industrial.Security/src/Industrial.Security.AspNetCore
          token: ${{ secrets.PLATFORM_CI_TOKEN }}

      - name: Checkout Health.Abstractions
        uses: actions/checkout@v4
        with:
          repository: wgtfee/Industrial.Health.Abstractions
          ref: master
          path: platform/Industrial.Health/src/Industrial.Health.Abstractions
          token: ${{ secrets.PLATFORM_CI_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore ThingsGateway server
        working-directory: platform/ThingsGateway
        run: dotnet restore src/ThingsGateway.Server/ThingsGateway.Server.csproj -p:EnableProPackages=false

      - name: Build ThingsGateway server
        working-directory: platform/ThingsGateway
        run: dotnet build src/ThingsGateway.Server/ThingsGateway.Server.csproj -f net8.0 --configuration Release --no-restore -p:EnableProPackages=false

      - name: Publish cloud validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'cloud-validation',
              description: passed ? 'ThingsGateway cloud validation passed' : 'ThingsGateway cloud validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
